<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="La Fenice"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>La Fenice</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#0a0a0a;color:#f0e6c8;font-family:'Playfair Display',serif;min-height:100vh}
    input,textarea,button,select{font-family:'Playfair Display',serif;-webkit-appearance:none;outline:none}
    .header{background:rgba(0,0,0,.97);border-bottom:1px solid #c9a84c22;padding:0 16px;position:sticky;top:0;z-index:100}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:8px}
    .logo{display:flex;align-items:center;gap:10px;cursor:pointer}
    .logo-img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 16px #c9a84c55}
    .logo-text{font-size:18px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#c9a84c,#f0d080);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .nb{background:transparent;border:1px solid transparent;color:#b0956a;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
    .nb.active{background:#c9a84c11;border-color:#c9a84c55;color:#f0d080}
    .lb{background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
    .ub{display:flex;align-items:center;gap:6px;background:#c9a84c11;border:1px solid #c9a84c33;border-radius:20px;padding:5px 10px;font-size:11px;color:#c9a84c}
    .ub button{background:none;border:none;color:#5a4020;cursor:pointer;font-size:11px}
    .hero{background:linear-gradient(180deg,#0d0900,#0a0a0a);padding:56px 16px 48px;text-align:center}
    .hero-img{width:150px;height:150px;border-radius:50%;object-fit:cover;margin:0 auto 18px;display:block;box-shadow:0 0 40px #c9a84c55,0 0 80px #8b000033}
    .hero-title{font-size:clamp(34px,8vw,70px);font-weight:900;letter-spacing:5px;background:linear-gradient(135deg,#c9a84c,#f0d080,#c9a84c,#8b6914);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:6px}
    .hero-sub{font-size:12px;letter-spacing:4px;color:#8b6914;text-transform:uppercase;margin-bottom:18px}
    .hero-div{width:90px;height:1px;background:linear-gradient(90deg,transparent,#c9a84c,transparent);margin:0 auto 18px}
    .hero-desc{font-size:15px;color:#c9a84c99;max-width:460px;margin:0 auto;line-height:1.8}
    .section{max-width:1100px;margin:0 auto;padding:36px 16px}
    .stitle{font-size:22px;font-weight:700;color:#c9a84c;letter-spacing:3px;text-transform:uppercase;margin-bottom:5px}
    .sline{width:48px;height:2px;background:linear-gradient(90deg,#c9a84c,transparent);margin-bottom:24px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
    .card{background:linear-gradient(145deg,#111100,#0d0d0d);border:1px solid #c9a84c22;border-radius:14px;overflow:hidden;cursor:pointer}
    .card-em{font-size:42px;text-align:center;padding:22px 0 8px;filter:drop-shadow(0 0 12px #c9a84c44)}
    .card-body{padding:0 16px 16px}
    .card-title{font-size:17px;font-weight:700;color:#f0d080;margin-bottom:4px}
    .card-meta{font-size:12px;color:#8b6914;margin-bottom:8px}
    .card-desc{font-size:13px;color:#b0956a;line-height:1.6;margin-bottom:12px}
    .tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
    .tag{background:#c9a84c11;border:1px solid #c9a84c33;color:#c9a84c;font-size:10px;padding:2px 9px;border-radius:20px}
    .pb{background:#1a1a1a;border-radius:4px;height:5px;margin-bottom:7px;overflow:hidden}
    .pf{height:100%;border-radius:4px}
    .pf-ok{background:linear-gradient(90deg,#c9a84c,#f0d080)}
    .pf-full{background:linear-gradient(90deg,#c94c4c,#ff6b6b)}
    .pi{font-size:11px;color:#7a6040;margin-bottom:10px}
    .btn-p{width:100%;background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;border:none;padding:10px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.5px}
    .btn-p-dis{width:100%;background:#2a2a2a;color:#555;border:none;padding:10px;border-radius:9px;font-size:13px}
    .btn-all{background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;border:none;padding:12px 26px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;margin-top:24px}
    .overlay{position:fixed;inset:0;background:#000c;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
    .modal{background:linear-gradient(145deg,#111100,#0c0c0c);border:1px solid #c9a84c44;border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
    .modal-title{font-size:19px;font-weight:700;color:#f0d080;margin-bottom:14px}
    .close-btn{position:absolute;top:12px;right:14px;background:none;border:none;color:#c9a84c;font-size:20px;cursor:pointer}
    .fg{margin-bottom:13px}
    label{display:block;font-size:11px;color:#8b6914;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
    input,textarea,select{width:100%;background:#0d0d0d;border:1px solid #c9a84c33;border-radius:9px;padding:9px 12px;color:#f0e6c8;font-size:13px}
    textarea{resize:vertical;min-height:70px}
    .sbtn{width:100%;background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;border:none;padding:12px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:700;margin-top:5px}
    .auth-tabs{display:flex;background:#0d0d0d;border-radius:9px;padding:3px;margin-bottom:18px;border:1px solid #c9a84c22}
    .at{flex:1;background:transparent;color:#8b6914;border:none;padding:8px;border-radius:7px;cursor:pointer;font-size:12px}
    .at.active{background:linear-gradient(135deg,#c9a84c,#a07830);color:#000;font-weight:700}
    .cc{background:#0d0d0d;border:1px solid #c9a84c1a;border-radius:9px;padding:9px 12px;margin-bottom:7px}
    .ca{font-size:11px;color:#c9a84c;font-weight:700;margin-bottom:2px}
    .ct{font-size:13px;color:#b0956a;line-height:1.5}
    .cd{font-size:10px;color:#4a3a20;margin-top:2px}
    .cin-row{display:flex;gap:7px}
    .cin-row input{flex:1}
    .notifica{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:9px;z-index:500;font-size:13px;white-space:nowrap;box-shadow:0 8px 24px #000a}
    .ns{background:linear-gradient(135deg,#1a1400,#0d0a00);border:1px solid #c9a84c;color:#f0d080}
    .ne{background:linear-gradient(135deg,#4a0000,#2a0000);border:1px solid #ff4444;color:#ff9999}
    .stats-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
    .scard{background:#0d0d00;border:1px solid #c9a84c33;border-radius:11px;padding:14px}
    .snum{font-size:30px;font-weight:900;color:#c9a84c;line-height:1}
    .slabel{font-size:10px;color:#7a6040;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
    .atabs{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap}
    .atab{background:transparent;border:1px solid #333;color:#7a6040;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:11px}
    .atab.active{background:#c9a84c11;border-color:#c9a84c55;color:#f0d080}
    .li{background:#0d0d0d;border:1px solid #c9a84c1a;border-radius:9px;padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
    .lt{color:#f0d080;font-weight:700;font-size:13px}
    .ls{font-size:11px;color:#7a6040;margin-top:2px}
    .delbtn{background:#2a0000;border:1px solid #4a0000;color:#ff6666;padding:4px 9px;border-radius:5px;cursor:pointer;font-size:11px}
    .pc{background:#0d0d0d;border:1px solid #c9a84c22;border-radius:11px;padding:16px;margin-bottom:9px}
    footer{border-top:1px solid #c9a84c1a;padding:26px 16px;text-align:center;margin-top:36px}
  </style>
</head>

const ADMIN_PASS="fenice2024";
let pagina="home",utente=null,modalEv=null,modalPr=null,adminTab="eventi",authTab="login",notif=null,ntimer=null;
let eventi=[
  {id:1,titolo:"Serata Jazz & Degustazione",data:"2026-03-22",ora:"20:00",desc:"Una serata unica con musica jazz dal vivo abbinata a una degustazione di vini pregiati e piatti della nostra cucina.",em:"🎷",posti:60,prenotati:24,tag:["Musica","Cibo"]},
  {id:2,titolo:"Spettacolo Flamenco",data:"2026-03-29",ora:"21:00",desc:"Ballerini professionisti di flamenco si esibiranno tra i tavoli mentre gustate la nostra cucina mediterranea.",em:"💃",posti:80,prenotati:51,tag:["Spettacolo","Cibo"]},

];
let commenti=[
  {id:1,eid:1,utente:"Maria R.",testo:"Non vedo l ora! L ultima serata jazz e stata fantastica.",data:"2026-03-10"},
  {id:2,eid:2,utente:"Luca T.",testo:"Ho gia prenotato! Il flamenco l anno scorso era uno spettacolo!",data:"2026-03-11"}
];
let prenotazioni=[];

function isAdmin(){return utente&&utente.email===ADMIN_EMAIL}
function fmt(d){return new Date(d).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}
function nota(m,t="s"){if(ntimer)clearTimeout(ntimer);notif={m,t};render();ntimer=setTimeout(()=>{notif=null;render()},3000)}
function g(id){return document.getElementById(id)}
function v(id){return g(id)?.value||""}

function render(){
  document.getElementById("app").innerHTML=build();
  bindAll();
}

function build(){
  return (notif?`<div class="notifica n${notif.t}">${notif.m}</div>`:"")
    +hdr()
    +(pagina==="home"?home():"")
    +(pagina==="eventi"?eventiPag():"")
    +(pagina==="login"?loginPag():"")
    +(pagina==="mie"?miePren():"")
    +(pagina==="admin"&&isAdmin()?adminPag():"")
    +(modalEv?modalEvento():"")
    +(modalPr?modalPrenota():"")
    +`<footer><div style="font-size:16px;color:#c9a84c;font-weight:700;letter-spacing:3px;margin-bottom:3px">🔥 LA FENICE</div><div style="font-size:11px;color:#4a3a20;letter-spacing:1px">Buon cibo · Musica · Spettacoli</div></footer>`;
}

function hdr(){
  const nav=[{id:"home",l:"Home"},{id:"eventi",l:"🗓 Eventi"},...(utente?[{id:"mie",l:"📋 Prenotazioni"}]:[]),...(isAdmin()?[{id:"admin",l:"👑 Admin"}]:[])];
  return`<header class="header"><div class="header-inner">
    <div class="logo" data-g="home"><img src="${LOGO}" class="logo-img"/><span class="logo-text">LA FENICE</span></div>
    <nav class="nav">
      ${nav.map(n=>`<button class="nb${pagina===n.id?" active":""}" data-g="${n.id}">${n.l}</button>`).join("")}
      ${utente?`<div class="ub">${isAdmin()?"👑":"👤"} ${utente.nome}<button data-action="logout">Esci</button></div>`
              :`<button class="lb" data-g="login">Accedi</button>`}
    </nav>
  </div></header>`;
}

function card(ev){
  const pct=ev.prenotati/ev.posti*100,es=ev.prenotati>=ev.posti;
  return`<div class="card" data-ev="${ev.id}">
    <div class="card-em">${ev.em}</div>
    <div class="card-body">
      <div class="card-title">${ev.titolo}</div>
      <div class="card-meta">📅 ${fmt(ev.data)} — ${ev.ora}</div>
      <div class="card-desc">${ev.desc.slice(0,80)}...</div>
      <div class="tags">${ev.tag.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="pb"><div class="pf ${pct>80?"pf-full":"pf-ok"}" style="width:${Math.min(pct,100)}%"></div></div>
      <div class="pi">${es?"🔴 Tutto esaurito":`${ev.posti-ev.prenotati} posti disponibili`}</div>
      ${utente?(es?`<div class="btn-p-dis">Esaurito</div>`:`<button class="btn-p" data-pr="${ev.id}">Prenota il tuo posto 🎟</button>`)
              :`<button class="btn-p" data-g="login">Accedi per prenotare</button>`}
    </div>
  </div>`;
}

function home(){
  return`<div class="hero">
    <img src="${LOGO}" class="hero-img"/>
    <div class="hero-title">LA FENICE</div>
    <div class="hero-sub">Associazione Culturale E.T.S.</div>
    <div class="hero-div"></div>
    <div class="hero-desc">Serate di buon cibo, musica dal vivo e spettacoli indimenticabili.</div>
  </div>
  <div class="section">
    <div class="stitle">Prossimi Eventi</div><div class="sline"></div>
    <div class="grid">${eventi.slice(0,3).map(card).join("")}</div>
    <div style="text-align:center"><button class="btn-all" data-g="eventi">Vedi tutti gli eventi →</button></div>
  </div>`;
}

function eventiPag(){
  return`<div class="section">
    <div class="stitle">Tutti gli eventi</div><div class="sline"></div>
    <div class="grid">${eventi.map(card).join("")}</div>
  </div>`;
}

function loginPag(){
  return`<div class="section" style="max-width:400px">
    <div class="stitle">${authTab==="l"?"Accedi":"Registrati"}</div><div class="sline"></div>
    <div class="auth-tabs">
      <button class="at${authTab==="l"?" active":""}" data-at="l">Accedi</button>
      <button class="at${authTab==="r"?" active":""}" data-at="r">Registrati</button>
    </div>
    ${authTab==="l"?`
      <div class="fg"><label>Email</label><input id="le" type="email" placeholder="la-tua@email.com"/></div>
      <div class="fg"><label>Password</label><input id="lp" type="password" placeholder="••••••••"/></div>
      <button class="sbtn" data-action="login">Accedi 🔥</button>
      <p style="font-size:11px;color:#5a4020;text-align:center;margin-top:12px">Admin: admin@lafenice.it / fenice2024</p>
    `:`
      <div class="fg"><label>Nome</label><input id="rn" placeholder="Il tuo nome"/></div>
      <div class="fg"><label>Email</label><input id="re" type="email" placeholder="la-tua@email.com"/></div>
      <div class="fg"><label>Password</label><input id="rp" type="password" placeholder="Min. 4 caratteri"/></div>
      <button class="sbtn" data-action="registra">Crea account 🔥</button>
    `}
  </div>`;
}

function miePren(){
  const mie=prenotazioni.filter(p=>p.email===utente?.email);
  return`<div class="section">
    <div class="stitle">Le Mie Prenotazioni</div><div class="sline"></div>
    ${mie.length===0?`<div style="color:#5a4020;font-size:14px">Nessuna prenotazione ancora. <button data-g="eventi" style="background:none;border:none;color:#c9a84c;cursor:pointer;font-size:14px">Scopri gli eventi →</button></div>`
    :mie.map(p=>`<div class="pc">
      <div style="color:#f0d080;font-weight:700;font-size:15px;margin-bottom:5px">${p.et}</div>
      <div style="font-size:12px;color:#8b6914">📅 ${fmt(p.ed)} &nbsp; 👥 ${p.pers} ${p.pers==1?"persona":"persone"}</div>
      ${p.note?`<div style="font-size:12px;color:#8b6914;margin-top:3px">📝 ${p.note}</div>`:""}
    </div>`).join("")}
  </div>`;
}

function adminPag(){
  const tp=prenotazioni.length,ts=eventi.reduce((a,e)=>a+e.prenotati,0);
  return`<div class="section">
    <div class="stitle">👑 Pannello Admin</div><div class="sline"></div>
    <div class="stats-g">
      <div class="scard"><div class="snum">${eventi.length}</div><div class="slabel">Eventi</div></div>
      <div class="scard"><div class="snum">${tp}</div><div class="slabel">Prenotazioni</div></div>
      <div class="scard"><div class="snum">${commenti.length}</div><div class="slabel">Commenti</div></div>
      <div class="scard"><div class="snum">${ts}</div><div class="slabel">Posti Occupati</div></div>
    </div>
    <div class="atabs">
      <button class="atab${adminTab==="eventi"?" active":""}" data-at2="eventi">📋 Eventi</button>

      <button class="atab${adminTab==="pren"?" active":""}" data-at2="pren">🎟 Prenotazioni</button>
      <button class="atab${adminTab==="comm"?" active":""}" data-at2="comm">💬 Commenti</button>
    </div>
    ${adminTab==="eventi"?eventi.map(ev=>`<div class="li">
      <div><div class="lt">${ev.em} ${ev.titolo}</div><div class="ls">${ev.data} · ${ev.prenotati}/${ev.posti}</div></div>
      <button class="delbtn" data-del-ev="${ev.id}">Elimina</button>
    </div>`).join(""):""}
    ${adminTab==="crea"?`<div style="max-width:480px">
      <div class="fg"><label>Titolo</label><input id="nt" placeholder="Nome serata"/></div>

  </div>`;
}

  const ev=eventi.find(e=>e.id===modalEv);if(!ev)return"";

      <div style="font-size:13px;color:#b0956a;line-height:1.8;margin-bottom:14px">${ev.desc}</div>
      <div class="tags">${ev.tag.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="pb" style="margin-top:10px"><div class="pf ${pct>80?"pf-full":"pf-ok"}" style="width:${Math.min(pct,100)}%"></div></div>
      <div class="pi" style="margin-bottom:16px">${ev.posti-ev.prenotati} posti su ${ev.posti} disponibili</div>
      <div style="border-top:1px solid #c9a84c22;padding-top:14px">
        <div style="font-size:12px;color:#c9a84c;font-weight:700;margin-bottom:9px;letter-spacing:1px">💬 COMMENTI (${ec.length})</div>
        ${ec.length===0?`<div style="font-size:12px;color:#4a3a20;margin-bottom:9px">Nessun commento ancora.</div>`:""}
        <div>${ec.map(c=>`<div class="cc"><div class="ca">${c.utente}</div><div class="ct">${c.testo}</div><div class="cd">${c.data}</div></div>`).join("")}</div>
        ${utente?`<div class="cin-row"><input id="nc" placeholder="Scrivi un commento..."/><button class="lb" data-action="add-comm">Invia</button></div>`
                :`<div style="font-size:12px;color:#5a4020"><button data-action="go-login" style="background:none;border:none;color:#c9a84c;cursor:pointer;font-size:12px">Accedi</button> per commentare</div>`}
      </div>
    </div>
  </div>`;
}

function modalPrenota(){
  const ev=eventi.find(e=>e.id===modalPr);if(!ev)return"";
  return`<div class="overlay" data-action="close-pr">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" data-action="close-pr">✕</button>
      <div class="modal-title">🎟 Prenota il tuo posto</div>
      <div style="font-size:13px;color:#8b6914;margin-bottom:18px">${ev.titolo}</div>
      <div class="fg"><label>Nome Completo</label><input id="pn" value="${utente?.nome||""}"/></div>
      <div class="fg"><label>Numero di persone</label><input id="pp" type="number" min="1" max="20" value="2"/></div>
      <div class="fg"><label>Note / Richieste speciali</label><textarea id="pno" placeholder="Allergie, preferenze tavolo..."></textarea></div>
      <button class="sbtn" data-action="conf-pr">Conferma Prenotazione 🎉</button>
    </div>
  </div>`;
}

function bindAll(){
  document.querySelectorAll("[data-g]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();pagina=el.dataset.g;render()}));
  document.querySelectorAll("[data-ev]").forEach(el=>el.addEventListener("click",()=>{modalEv=parseInt(el.dataset.ev);render()}));
  document.querySelectorAll("[data-pr]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();modalPr=parseInt(el.dataset.pr);render()}));
  document.querySelectorAll("[data-at]").forEach(el=>el.addEventListener("click",()=>{authTab=el.dataset.at;render()}));
  document.querySelectorAll("[data-at2]").forEach(el=>el.addEventListener("click",()=>{adminTab=el.dataset.at2;render()}));
  document.querySelectorAll("[data-del-ev]").forEach(el=>el.addEventListener("click",()=>{eventi=eventi.filter(e=>e.id!==parseInt(el.dataset.delEv));nota("Evento eliminato");render()}));
  document.querySelectorAll("[data-del-c]").forEach(el=>el.addEventListener("click",()=>{commenti=commenti.filter(c=>c.id!==parseInt(el.dataset.delC));nota("Commento eliminato");render()}));

  const actions={
    "logout":()=>{utente=null;pagina="home";render()},
    "close-ev":()=>{modalEv=null;render()},
    "close-pr":()=>{modalPr=null;render()},
    "go-login":()=>{modalEv=null;pagina="login";render()},
    "login":()=>{
      const em=v("le"),ps=v("lp");
      if(em===ADMIN_EMAIL&&ps===ADMIN_PASS){utente={nome:"Admin",email:em};pagina="home";nota("Benvenuto Admin! 👑")}
      else if(em&&ps.length>=4){utente={nome:em.split("@")[0],email:em};pagina="home";nota("Benvenuto a La Fenice! 🔥")}
      else nota("Credenziali non valide","e");
    },
    "registra":()=>{
      const n=v("rn"),e=v("re"),p=v("rp");
      if(!n||!e||p.length<4){nota("Compila tutti i campi","e");return}
      utente={nome:n,email:e};pagina="home";nota("Benvenuto "+n+"! 🔥");
    },
    "add-comm":()=>{
      const t=v("nc");if(!t.trim())return;
      commenti.push({id:Date.now(),eid:modalEv,utente:utente.nome,testo:t,data:new Date().toISOString().split("T")[0]});
      nota("Commento aggiunto!");render();
    },
    "conf-pr":()=>{
      const n=v("pn"),pers=parseInt(v("pp")||"2"),no=v("pno"),ev=eventi.find(e=>e.id===modalPr);
      if(!n){nota("Inserisci il tuo nome","e");return}
      if(pers>(ev.posti-ev.prenotati)){nota("Solo "+( ev.posti-ev.prenotati)+" posti disponibili","e");return}
      ev.prenotati+=pers;
      prenotazioni.push({id:Date.now(),et:ev.titolo,ed:ev.data,utente:n,email:utente.email,pers,note:no,data:new Date().toISOString().split("T")[0]});
      modalPr=null;nota("Prenotazione confermata! 🎉");
    },
    "crea-ev":()=>{
      const t=v("nt"),em=v("ne"),d=v("nd"),o=v("no"),p=parseInt(v("np")||"50"),ta=v("nta").split(",").map(x=>x.trim()).filter(Boolean),dc=v("nd2");
      if(!t||!d||!o){nota("Compila titolo, data e ora","e");return}
      eventi.push({id:Date.now(),titolo:t,em,data:d,ora:o,desc:dc,posti:p,prenotati:0,tag:ta});
      nota("Evento creato! ✨");adminTab="eventi";render();
    }
  };
  document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();const a=el.dataset.action;if(actions[a])actions[a]()}));
  const nc=document.getElementById("nc");
  if(nc)nc.addEventListener("keydown",e=>{if(e.key==="Enter"&&actions["add-comm"])actions["add-comm"]()});
}

render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
